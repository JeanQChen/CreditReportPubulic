# =============================================================================
# 报告时钟配置 v1（唯一版本化时钟/时区资产）
# 载体：templates/policies/report_clock_v1.yaml
#
# 业务裁决（M930-3 批次 A 一.4，DESIGN_V2.md O-11）：
#   一次运行只捕获**一个时钟瞬间**。
#     generated_at  = 该瞬间的 UTC 时间戳（轨迹/运行身份时间）
#     report_as_of  = **同一瞬间**按本资产 report_timezone 换算的**报告生成日**
#   二者是不同字段，且有确定派生关系，禁止分别采样——分别采样会在时区跨午夜时
#   产生错位（例如 UTC 2026-09-23T16:30 在 UTC+8 已是 2026-09-24）。
#
#   FinancialSnapshot.as_of_date 始终只表示**财务数据期末**，不得再被用来推导
#   report_as_of。
#
# 缺本资产或缺 report_timezone 即 fail-closed（harness/report_clock.py 抛错），
# 不回落系统本地时区、不回落 UTC 猜测。
#
# 本资产公司无关、文件名无关、页码无关；不含任何 case_id / 公司名 / 固定年份规则。
# =============================================================================

policy_id: report_clock_v1
policy_version: v1
schema_version: report-clock-v1
status: approved
created_at: "2026-09-23"
approved_at: "2026-09-23"
policy_name: "报告时钟配置 v1（单一时钟瞬间 + 报告生成日时区）"

# 报告生成日（report_as_of）使用的时区，必须是有证据的 IANA 时区名。
# 只影响「哪一天算报告生成日」，不影响任何财务期末/期间身份。
report_timezone: "Asia/Shanghai"

# 上述时区的取值依据（审计用，不参与计算）。
report_timezone_basis: "业务报告面向中国境内主体披露材料，报告生成日按中国标准时间（UTC+8）计日"
