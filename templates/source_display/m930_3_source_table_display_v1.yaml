# M930-3 演示：**运行级来源展示记录**（数据，不是生产规则）
#
# `DESIGN_V2.md` §0.21 允许「本次选择的页和区域」作为运行级来源记录存在。生产代码里
# （`sections/source_table_display.py`）没有任何公司名、证券代码或固定页码的判断分支；
# 本文件是这一批数据本身的坐标清单。
#
# 每一条 region 给出：登记来源的 document_id + 声明版本、页号、PDF 点区域
# （`(x0, top, x1, bottom)`，原点左上，与 pdfplumber 同口径）、表题、可确认期间与单位、
# 以及两类**可复算锚点**：
#   * `title_anchor` 必须出现在**该页**文字层里 —— 页号指错地方就当场报缺陷；
#   * `row_anchors` 必须出现在**该区域**文字层里 —— 区域切到别的表或只切半张就当场报缺陷。
#
# 原文件哈希**不写在这里**：它由本次已登记的电子 PDF 来源清单在运行时给出并实测比对，
# 避免同一件事有两个名字。
#
# 续表（跨页）用 `continuation_of` 指向**本文件中更早**的一条，展示顺序即这里的顺序。

