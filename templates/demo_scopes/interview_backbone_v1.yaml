selected_sections:
  - section_id: company
    selection_reason: 代表性公司章节：承载本地长叙述、树结构材料与事件负面核验三个能力面
    design_surface_ids:
      - ds.local_narrative
      - ds.tree_material
      - ds.claim_citation
      - ds.gap_visibility
  - section_id: financial
    selection_reason: 代表性财务章节：承载结构化财务事实与财务附注两个能力面
    design_surface_ids:
      - ds.financial_authority
      - ds.note_fact
      - ds.gap_visibility
  - section_id: industry
    selection_reason: 代表性行业章节：承载外部检索 funnel 能力面
    design_surface_ids:
      - ds.external_funnel
      - ds.gap_visibility

selected_topics:
  - topic_id: company_identity
    section_id: company
    selection_reason: 公司主体身份面：提供最小输入身份与 scope 分区展示
    design_surface_ids:
      - ds.input_identity
      - ds.scope_partition
  - topic_id: company_business
    section_id: company
    selection_reason: 本地长叙述能力面：由多个合格 span 与事实形成一段可读正文
    design_surface_ids:
      - ds.local_narrative
      - ds.tree_material
      - ds.claim_citation
      - ds.table_capability
  - topic_id: company_legal_risks
    section_id: company
    selection_reason: 事件负面核验能力面：展示真实终态而非把未取得写成不存在
    design_surface_ids:
      - ds.event_negative
      - ds.claim_citation
  - topic_id: fin_source_scope
    section_id: financial
    selection_reason: 财务权威面：报表可得性与审计意见的结构化事实与附注事实
    design_surface_ids:
      - ds.financial_authority
      - ds.note_fact
  - topic_id: fin_solvency
    section_id: financial
    selection_reason: 财务权威面：偿债能力结构化指标与缺口可见性
    design_surface_ids:
      - ds.financial_authority
      - ds.gap_visibility
  - topic_id: industry_scale_cycle
    section_id: industry
    selection_reason: 外部行业研究面：经 fetch 与不可变 snapshot 校验的 adopted fact 或完整 funnel gap
    design_surface_ids:
      - ds.external_funnel
      - ds.tree_material

# 允许使用的能力取自冻结 Contract 的 allowed_capabilities 词表，不新增动词。
material_capabilities:
  - search_evidence
  - search_tables
  - inspect_evidence
  - compare_evidence
  - verify_claim
  - search_external_sources
  - fetch_external_content
  - lookup_financial_metric
  - lookup_company_field

fallback_policy_id: navigation_then_bounded_fallback_v1
budget_policy_id: demo_backbone_budget_v1
budget_policy_version: v1

company_independent: true

