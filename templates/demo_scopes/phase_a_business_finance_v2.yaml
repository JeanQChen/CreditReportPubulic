# M930-3 **阶段 A** DemoScope Profile，**v2**（公司无关）。**只增不改**：
# `phase_a_business_finance_v1.yaml` 与更早两份声明源一字不动，历史 run 与四类冻结资产都不动，
# 本文件是**新增的第四份声明源**。
#
# 与 v1 的实质差异**只有一处**：`selected_topics` 增补 `fin_balance_structure`。
#   v1 的财务节只选 `fin_source_scope`（确定性来源/口径）与 `fin_solvency`（唯一模型写作 topic），
#   于是冻结 Contract 里 `fin_balance_structure` 的三栏（`balance_structure` /
#   `major_account_changes` / `fifteen_pct_forced_analysis`）虽然在 Contract、WritingSpec、
#   权威快照里都已存在，却**不在任何一次运行的范围内**——`FinancialFactPack` 里的
#   `item_*` 资产负债事实因此在 Pack→Writer 处被静默丢弃（`pack_writer.scan_financial` 对
#   `topic_for_fact(fact_id) == OUTSIDE_SECTION_TOPIC` 的事实直接跳过）。
#   把该 topic 纳入范围，是让**已有**合格事实真正接到读者正文的唯一入口。
#
# 为什么**不能**改 v1：v1 是历史基线的范围声明，其 `profile_fingerprint` 进投影、清单与
# 报告版本身份。改它等于改写历史 run 的身份。新增版本是唯一合规做法。
#
# 主体身份（`company_id`、登记名、`report_as_of`、三份来源身份）仍在输入/预检/manifest 里
# 核实——这不等于选择 `company_identity` topic。`company_identity`、`company_legal_risks`、
# `industry_scale_cycle` 及相应外部/事件能力在本阶段明确列为 `out_of_scope/not_demonstrated`，
# 这不是"跳过"、不是"失败"，也不是"来源不存在"。
#
# 本文件是**声明源**，不是第二个 wire 类型：加载后一切身份都落在
# planning.demo_scope_schema.DemoScopeProfile 上，并由末尾的 profile_fingerprint 承诺。
#
# 范围推导规则（与前三份同，不反过来从任何公司命中页/答案/既有结果反推）：
#   1. selected_sections 的每个 section 必须存在；
#   2. selected_topics 的每个 topic 必须存在，且其父 section 已被**显式**选中；范围
#      粒度边界是 topic —— 每个被显式选中的 topic 的**全部 question/aspect** 进入范围；
#   3. 未被显式选中的 topic 一律不进入 Demo 范围；冻结 Contract 的其余部分构成
#      out_of_scope，二者严格互补、不重叠、不遗漏。
#
# 生产规则、Contract、policy、测试与通用派生逻辑不得包含公司名、证券代码、固定页码、
# 表号、Evidence ID、gold 或答案关键词特判；公司身份只允许存在于输入、运行 manifest、
# evaluation fixture 与展示产物中。
#
# profile_fingerprint 由 `python -m planning.demo_scope --fingerprint` 打印后回填；
# 加载入口 `load_demo_scope_profile()` 始终 fail-closed，不提供任何绕过开关。
#
# `status: candidate` 是**如实**取值，不是占位：本 profile 尚未经人工批准，程序不代签。
# 它**不影响**加载（`load_demo_scope_profile` 只校验资产与指纹，不校验 profile 自身生命周期），
# 但读者面因此能看出「这一版范围是谁定的、有没有被批准过」。

schema_version: demo-scope-profile-v1
profile_id: phase_a_business_finance
