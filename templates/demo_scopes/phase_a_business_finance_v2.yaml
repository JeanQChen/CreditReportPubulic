selected_sections:
  - section_id: company
    selection_reason: 阶段 A 公司侧：只承载主营业务（`company_business`）这一个 topic 的本地长叙述面
    design_surface_ids:
      - ds.local_narrative
      - ds.tree_material
      - ds.claim_citation
      - ds.gap_visibility
  - section_id: financial
    selection_reason: 阶段 A 财务侧：承载结构化财务事实、资产负债结构呈现与财务附注三个能力面
    design_surface_ids:
      - ds.financial_authority
      - ds.note_fact
      - ds.gap_visibility

selected_topics:
  - topic_id: company_business
    section_id: company
    selection_reason: 阶段 A 唯一公司 topic：由多个合格 span 与事实形成可读的主营业务正文
    design_surface_ids:
      - ds.local_narrative
      - ds.tree_material
      - ds.claim_citation
      - ds.table_capability
  - topic_id: fin_source_scope
    section_id: financial
    selection_reason: 财务权威面：报表可得性与审计意见的结构化事实与附注事实
    design_surface_ids:
      - ds.financial_authority
      - ds.note_fact
  # v2 新增（v1 无此条）：把冻结 Contract 已有的资产负债三栏纳入范围，使**已有**合格
  # `item_*` 事实不再被 `scan_financial` 当作范围外丢弃。它走**确定性**呈现（零模型调用），
  # 因此**不**占用「一节一个 Writer topic」的名额——`fin_solvency` 仍是本节唯一模型写作 topic。
  - topic_id: fin_balance_structure
    section_id: financial
    selection_reason: 财务权威面：资产负债结构、重大科目变化与 15% 强制分析栏，由合格 item 事实确定性成文
    design_surface_ids:
      - ds.financial_authority
      - ds.table_capability
      - ds.gap_visibility
  - topic_id: fin_solvency
    section_id: financial
    selection_reason: 财务权威面：偿债能力结构化指标与缺口可见性
    design_surface_ids:
      - ds.financial_authority
      - ds.gap_visibility

# 允许使用的能力取自冻结 Contract 的 allowed_capabilities 词表，不新增动词。
