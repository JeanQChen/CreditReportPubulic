# M930-3 **阶段 A** DemoScope Profile（公司无关）。**只增不改**：`interview_backbone_v1.yaml`
# 与 `interview_backbone_dual_section_v1.yaml` 一字不动，历史 run 与四类冻结资产都不动，
# 本文件是**新增的第三份声明源**。
#
# 与 `interview_backbone_dual_section_v1.yaml` 的实质差异只有一处，但它决定了整条链的范围：
#   `selected_topics` 去掉 `company_identity` 与 `company_legal_risks`。
#
# 为什么必须去掉（`2026-09-30_DEMO_BACKBONE_MILESTONE.md` §16 第 1 条）：
#   阶段 A 的公司侧只选 `company_business`。节级写作清单是从**本节的 `pack_set`** 现造的，
#   而 `pack_set` 的 topic 由本 profile 的 `selected_topics` 决定。把 `company_identity` /
#   `company_legal_risks` 留在范围内，节级清单里就会混进这两个 topic 的材料；
#   离线替身按**位置**发材料时，它们会被发进主营业务的小节里（r21 里
#   `company_supplier_concentration.supplier_concentration_change` 写出三句"一致行动人协议
#   终止"就是这么来的）。范围不收窄，任何"逐句栏目核对"都只能事后打补丁。
#
# 主体身份（`company_id`、登记名、`report_as_of`、三份来源身份）仍在输入/预检/manifest 里
# 核实——这不等于选择 `company_identity` topic。`company_identity`、`company_legal_risks`、
# `industry_scale_cycle` 及相应外部/事件能力在本阶段明确列为 `out_of_scope/not_demonstrated`，
# 这不是"跳过"、不是"失败"，也不是"来源不存在"。
#
# 本文件是**声明源**，不是第二个 wire 类型：加载后一切身份都落在
# planning.demo_scope_schema.DemoScopeProfile 上，并由末尾的 profile_fingerprint 承诺。
#
# 范围推导规则（与前两份同，不反过来从任何公司命中页/答案/既有结果反推）：
#   1. selected_sections 的每个 section 必须存在；
#   2. selected_topics 的每个 topic 必须存在，且其父 section 已被**显式**选中；范围
#      粒度边界是 topic —— 每个被显式选中的 topic 的**全部 question/aspect** 进入范围；
#   3. 未被显式选中的 topic 一律不进入 Demo 范围；冻结 Contract 的其余部分构成
#      out_of_scope，二者严格互补、不重叠、不遗漏。
#
# 生产规则、Contract、policy、测试与通用派生逻辑不得包含公司名、证券代码、固定页码、
# 表号、Evidence ID、gold 或答案关键词特判；公司身份只允许存在于输入、运行 manifest、
# evaluation fixture 与展示产物中。
#
# profile_fingerprint 由 `python -m planning.demo_scope --fingerprint` 打印后回填；
# 加载入口 `load_demo_scope_profile()` 始终 fail-closed，不提供任何绕过开关。

